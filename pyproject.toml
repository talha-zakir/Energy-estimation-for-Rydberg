[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rydberg-mnist"
version = "0.1.0"
description = "Paper-informed digital-analog Rydberg classifier with a linear regression readout"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7", "threadpoolctl>=3.1"]

[project.scripts]
rydberg-mnist = "rydberg_mnist.experiment:main"

[tool.setuptools.packages.find]
include = ["rydberg_mnist*"]
